name: setup-node
description: setup node and install packages

inputs:
  check-package:
    description: "Check package"
    default: false
  turbo-cache:
    description: "Restore and save the local Turborepo cache"
    default: false

runs:
  using: composite
  steps:
    - name: Get Node.js version from volta
      shell: bash
      run: echo "NODE_VERSION=$(jq -r .volta.node package.json)" >> $GITHUB_ENV

    - name: Get npm version from volta
      shell: bash
      run: echo "NPM_VERSION=$(jq -r .volta.npm package.json)" >> $GITHUB_ENV

    - name: Setup Node.js
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
      with:
        registry-url: "https://registry.npmjs.org"
        node-version: ${{ env.NODE_VERSION || 'lts/*' }}

    - name: Setup npm version
      if: ${{ env.NPM_VERSION }}
      shell: bash
      run: npm install -g npm@${{ env.NPM_VERSION }}

    - name: Check package
      if: inputs.check-package == 'true'
      run: npm run package:check
      shell: bash

    - name: Install package
      run: npm ci
      shell: bash

    - name: Cache Turborepo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-
          ${{ runner.os }}-turbo-
