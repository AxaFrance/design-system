name: Compile Agentic Workflows

on:
  push:
    paths:
      - '.github/workflows/*.md'
      - '.github/workflows/compile-agentic-workflows.yml'
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/*.md'
    branches:
      - main

jobs:
  compile:
    name: Compile workflow files
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup GitHub CLI
        run: |
          which gh || (apt-get update && apt-get install -y gh)
          gh version

      - name: Compile agentic workflows
        run: |
          for workflow in .github/workflows/*.md; do
            if [[ -f "$workflow" ]]; then
              echo "Compiling $workflow..."
              gh aw compile "$workflow"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet .github/workflows/*.lock.yml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit compiled workflows
        if: steps.check.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/workflows/*.lock.yml
          git commit -m "chore(ci): regenerate agentic workflow lock files"
          git push

      - name: Comment on PR with warning
        if: steps.check.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Workflow compilation needed**: The agentic workflow lock files need to be regenerated. Please run `gh aw compile .github/workflows/*.md` locally and commit the changes.'
            })
